name: Frame Google Drive check

on:
  push:
    branches: [feature/google-photos-drive]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm dedupe
      - run: npx expo-doctor
      - run: npx expo export --platform ios --output-dir dist-check
