name: Frame OAuth redirect check

on:
  push:
    branches: [fix/google-oauth-redirect]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 1234567890-test.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm dedupe
      - run: npx expo-doctor
      - run: npx expo config --type public
      - run: npx expo export --platform ios --output-dir dist-check
