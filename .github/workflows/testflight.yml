name: Frame to TestFlight

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: read

concurrency:
  group: frame-testflight
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}

    steps:
      - name: Check out Frame
        uses: actions/checkout@v4

      - name: Verify Google OAuth config
        shell: bash
        run: |
          if [ -z "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]; then
            echo "::error::Missing GitHub Actions secret GOOGLE_IOS_CLIENT_ID. Frame Google Photos cannot work without it."
            exit 1
          fi
          case "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *)
              echo "::error::GOOGLE_IOS_CLIENT_ID is not a valid Google iOS OAuth client ID."
              exit 1
              ;;
          esac

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm dedupe

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Generate native iOS project
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean

      - name: Install TestFlight lane
        run: |
          mkdir -p ios/fastlane
          cp ios-ci/Gemfile ios/Gemfile
          cp ios-ci/Fastfile ios/fastlane/Fastfile

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Build, sign and upload Frame
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane beta
