<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Frame — Web</title>
<meta name="theme-color" content="#09090b" />
<style>
:root{--bg:#09090b;--panel:#141417;--panel2:#1b1b20;--line:#2c2c33;--text:#fff;--muted:#9b9ba5;--purple:#8b7cff;--green:#45d17a;--red:#ff5b64;--blue:#6cb8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:18px;background:#0d0d10;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;padding:7px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#0b0b0e;font-weight:950;background:linear-gradient(145deg,#fff,#bcb7ff 48%,#7d6cff)}.nav{display:grid;gap:8px;margin-top:28px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 13px;border-radius:13px;font-weight:760}.nav button.active,.nav button:hover{background:var(--panel);color:#fff}.sidebottom{margin-top:auto;color:#73737d;font-size:12px;line-height:1.45}.main{min-width:0}.top{position:sticky;top:0;z-index:30;padding:18px 24px;border-bottom:1px solid rgba(44,44,51,.75);background:rgba(9,9,11,.88);backdrop-filter:blur(18px);display:flex;align-items:center;gap:14px}.title{font-size:24px;font-weight:900;letter-spacing:-.6px}.grow{flex:1}.btn{border:1px solid var(--line);background:var(--panel);color:#fff;padding:10px 14px;border-radius:12px;font-weight:800}.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.danger{color:#ff7c84}.search{width:min(360px,38vw);background:#111115;border:1px solid var(--line);color:#fff;padding:10px 13px;border-radius:12px;outline:none}.content{padding:24px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat{padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#151519,#101013)}.stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:13px}.empty{min-height:62vh;display:grid;place-items:center;text-align:center}.emptybox{max-width:540px}.emptyicon{width:92px;height:92px;margin:auto;border-radius:28px;background:linear-gradient(145deg,#fff,#bcb7ff 48%,#7d6cff);display:grid;place-items:center;color:#0b0b0e;font-size:42px;font-weight:950;box-shadow:0 24px 80px rgba(139,124,255,.2)}h1{font-size:48px;letter-spacing:-2.4px;margin:24px 0 12px}.muted{color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.thumb{aspect-ratio:1;position:relative;border-radius:13px;overflow:hidden;background:#17171c;border:1px solid #25252b}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.heart{position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.52);color:#fff;font-size:16px}.badge{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.62);padding:5px 7px;border-radius:8px;font-size:11px;font-weight:800}.cleanup{display:grid;place-items:center;min-height:calc(100vh - 140px);touch-action:none}.cleanupwrap{width:min(520px,92vw);text-align:center}.cleanupcard{position:relative;width:100%;aspect-ratio:.84;border-radius:28px;overflow:hidden;background:#151519;border:1px solid var(--line);box-shadow:0 28px 100px rgba(0,0,0,.4);transform:translateX(var(--dx,0px)) rotate(calc(var(--dx,0px)/28));transition:transform .18s ease}.cleanupcard.dragging{transition:none}.cleanupcard img{width:100%;height:100%;object-fit:contain;background:#050506}.swipebadge{position:absolute;top:24px;padding:8px 12px;border-radius:10px;font-size:22px;font-weight:950;letter-spacing:1px;opacity:0}.swipebadge.keep{left:20px;color:var(--green);border:3px solid var(--green)}.swipebadge.delete{right:20px;color:var(--red);border:3px solid var(--red)}.filename{position:absolute;bottom:0;left:0;right:0;padding:50px 18px 18px;background:linear-gradient(transparent,rgba(0,0,0,.9));text-align:left;font-weight:800}.cleanupcontrols{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:18px}.round{width:62px;height:62px;border-radius:50%;border:2px solid var(--line);background:#111115;color:#fff;font-size:24px;font-weight:950}.round.keep{border-color:var(--green)}.round.delete{border-color:var(--red)}.progress{color:var(--muted);font-size:13px;margin-top:11px}.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.album{border:1px solid var(--line);background:var(--panel);padding:18px;border-radius:18px;min-height:130px}.album b{font-size:19px}.album span{display:block;color:var(--muted);margin-top:5px}.album button{margin-top:18px}.deletedrow{display:flex;align-items:center;gap:14px;padding:12px;border-bottom:1px solid var(--line)}.deletedrow img{width:64px;height:64px;object-fit:cover;border-radius:10px}.deletedrow .meta{flex:1;min-width:0}.deletedrow .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deletedrow .meta span{color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(720px,96vw);max-height:90vh;overflow:auto;background:#111115;border:1px solid var(--line);border-radius:22px;padding:18px}.viewerimg{width:100%;max-height:68vh;object-fit:contain;background:#050506;border-radius:16px}.viewerbar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.viewername{flex:1;min-width:180px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;background:#fff;color:#000;padding:10px 14px;border-radius:999px;font-weight:800;z-index:200;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hidden{display:none!important}@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:50;border-right:0;border-top:1px solid var(--line);padding:8px}.brand,.sidebottom{display:none}.nav{margin:0;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{font-size:11px;text-align:center;padding:10px 4px}.main{padding-bottom:72px}.top{padding:12px}.title{font-size:20px}.search{display:none}.content{padding:14px}.stats{grid-template-columns:1fr 1fr}h1{font-size:38px}.grid{grid-template-columns:repeat(3,1fr)}.cleanup{min-height:calc(100vh - 190px)}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><span class="logo">F</span>Frame</div><div class="nav" id="nav"><button data-view="photos" class="active">Photos</button><button data-view="cleanup">Cleanup</button><button data-view="albums">Albums</button><button data-view="search">Search</button><button data-view="deleted">Deleted</button></div><div class="sidebottom">Frame Web stores your imported photos in this browser using IndexedDB. Your original files are not deleted.</div></aside>
<main class="main"><header class="top"><div class="title" id="viewTitle">Photos</div><div class="grow"></div><input class="search hidden" id="searchBox" placeholder="Search photos or albums…"/><button class="btn" id="newAlbumBtn">+ Album</button><button class="btn primary" id="importBtn">Import photos</button><input id="fileInput" type="file" accept="image/*" multiple class="hidden"/></header><section class="content" id="content"></section></main>
</div>
<div class="modal" id="viewer"><div class="dialog"><img class="viewerimg" id="viewerImg" alt="Selected photo"/><div class="viewerbar"><div class="viewername" id="viewerName"></div><button class="btn" id="favBtn">♡ Favourite</button><button class="btn" id="addAlbumBtn">Add to album</button><button class="btn danger" id="deleteBtn">Delete</button><button class="btn" id="closeViewer">Close</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DB_NAME='frame-web-v1', STORE='photos', META='meta';
let db, photos=[], albums=[], view='photos', selectedId=null, cleanupIds=[], cleanupIndex=0, undoStack=[];
const $=s=>document.querySelector(s), content=$('#content'), toastEl=$('#toast');
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(META))d.createObjectStore(META)};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){photos=await reqP(tx(STORE).getAll());albums=(await reqP(tx(META).get('albums')))||[];purgeExpired();render()}
async function savePhoto(p){await reqP(tx(STORE,'readwrite').put(p));const i=photos.findIndex(x=>x.id===p.id);if(i>=0)photos[i]=p;else photos.push(p)}
async function removePhoto(id){await reqP(tx(STORE,'readwrite').delete(id));photos=photos.filter(p=>p.id!==id)}
async function saveAlbums(){await reqP(tx(META,'readwrite').put(albums,'albums'))}
function urlFor(p){return URL.createObjectURL(p.blob)}
async function purgeExpired(){const cutoff=Date.now()-30*86400000;for(const p of [...photos])if(p.deletedAt&&p.deletedAt<cutoff)await removePhoto(p.id)}
function active(){return photos.filter(p=>!p.deletedAt)}
function deleted(){return photos.filter(p=>p.deletedAt)}
function unreviewed(){return active().filter(p=>!p.reviewed)}
function favs(){return active().filter(p=>p.favorite)}
function setView(v){view=v;$('#viewTitle').textContent={photos:'Photos',cleanup:'Cleanup',albums:'Albums',search:'Search',deleted:'Recently Deleted'}[v];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#searchBox').classList.toggle('hidden',v!=='search');$('#newAlbumBtn').classList.toggle('hidden',v!=='albums');render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.view)});
$('#importBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;toast('Importing '+files.length+' photo'+(files.length>1?'s':''));for(const f of files){await savePhoto({id:uid(),name:f.name,blob:f,type:f.type,size:f.size,createdAt:Date.now(),favorite:false,reviewed:false,deletedAt:null,albumIds:[]})}e.target.value='';toast('Imported '+files.length);render()};
$('#newAlbumBtn').onclick=async()=>{const name=prompt('Album name');if(!name?.trim())return;albums.push({id:uid(),name:name.trim()});await saveAlbums();render()};
$('#searchBox').oninput=render;
function render(){if(view==='photos')renderPhotos();else if(view==='cleanup')renderCleanup();else if(view==='albums')renderAlbums();else if(view==='search')renderSearch();else renderDeleted()}
function stats(){const a=active();return `<div class="stats"><div class="stat"><b>${a.length}</b><span>Photos</span></div><div class="stat"><b>${unreviewed().length}</b><span>Unreviewed</span></div><div class="stat"><b>${favs().length}</b><span>Favourites</span></div><div class="stat"><b>${deleted().length}</b><span>Recently Deleted</span></div></div>`}
function renderPhotos(){const a=active();if(!a.length){content.innerHTML=`<div class="empty"><div class="emptybox"><div class="emptyicon">F</div><h1>Your web library is empty.</h1><p class="muted">Import photos from your computer, Google Photos downloads, Google Takeout, iCloud Drive, or any folder your browser can access. Frame stores its own browser copy and leaves the originals alone.</p><button class="btn primary" onclick="document.querySelector('#fileInput').click()">Import photos</button></div></div>`;return}content.innerHTML=stats()+gridHTML(a)}
function gridHTML(list){return `<div class="grid">${list.map(p=>`<div class="thumb" data-id="${p.id}"><img data-id="${p.id}" alt="${escapeHtml(p.name)}"><button class="heart" data-fav="${p.id}">${p.favorite?'♥':'♡'}</button>${p.reviewed?'<div class="badge">Reviewed</div>':''}</div>`).join('')}</div>`}
function hydrateImages(root=content){root.querySelectorAll('img[data-id]').forEach(img=>{const p=photos.find(x=>x.id===img.dataset.id);if(p){const u=urlFor(p);img.src=u;img.onload=()=>URL.revokeObjectURL(u)}})}
content.addEventListener('click',async e=>{const fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();const p=photos.find(x=>x.id===fav.dataset.fav);p.favorite=!p.favorite;await savePhoto(p);render();return}const t=e.target.closest('.thumb');if(t)openViewer(t.dataset.id);const alb=e.target.closest('[data-album]');if(alb)openAlbum(alb.dataset.album);const restore=e.target.closest('[data-restore]');if(restore){const p=photos.find(x=>x.id===restore.dataset.restore);p.deletedAt=null;p.reviewed=true;await savePhoto(p);render();toast('Restored')}const perm=e.target.closest('[data-perm]');if(perm){if(confirm('Permanently delete this photo from Frame Web?')){await removePhoto(perm.dataset.perm);render()}}});
const oldRender=render;render=function(){if(view==='photos')renderPhotos();else if(view==='cleanup')renderCleanup();else if(view==='albums')renderAlbums();else if(view==='search')renderSearch();else renderDeleted();hydrateImages()};
function renderCleanup(){if(!cleanupIds.length||cleanupIds.some(id=>!photos.find(p=>p.id===id&&!p.deletedAt))){cleanupIds=unreviewed().map(p=>p.id);cleanupIndex=0}if(!cleanupIds.length){content.innerHTML=`<div class="empty"><div class="emptybox"><h1>All caught up.</h1><p class="muted">Every active photo has been reviewed.</p><button class="btn" id="reviewAll">Review all photos again</button></div></div>`;setTimeout(()=>$('#reviewAll')&&($('#reviewAll').onclick=()=>{cleanupIds=active().map(p=>p.id);cleanupIndex=0;render()}));return}const id=cleanupIds[cleanupIndex%cleanupIds.length],p=photos.find(x=>x.id===id);content.innerHTML=`<div class="cleanup"><div class="cleanupwrap"><div class="cleanupcard" id="cleanupCard"><img data-id="${p.id}" alt="${escapeHtml(p.name)}"><div class="swipebadge keep" id="keepBadge">KEEP</div><div class="swipebadge delete" id="deleteBadge">DELETE</div><div class="filename">${escapeHtml(p.name)}</div></div><div class="cleanupcontrols"><button class="round keep" id="keepBtn">←</button><button class="btn" id="undoBtn">Undo</button><button class="round delete" id="delBtn">→</button></div><div class="progress">Swipe left to keep • swipe right to delete • ${cleanupIndex+1} / ${cleanupIds.length}</div></div></div>`;hydrateImages();setupSwipe(p)}
function setupSwipe(p){const card=$('#cleanupCard'),kb=$('#keepBadge'),dbb=$('#deleteBadge');let start=0,dx=0,drag=false;const apply=()=>{card.style.setProperty('--dx',dx+'px');kb.style.opacity=Math.max(0,Math.min(1,-dx/100));dbb.style.opacity=Math.max(0,Math.min(1,dx/100))};const reset=()=>{dx=0;card.classList.remove('dragging');apply()};card.onpointerdown=e=>{drag=true;start=e.clientX;card.setPointerCapture(e.pointerId);card.classList.add('dragging')};card.onpointermove=e=>{if(!drag)return;dx=e.clientX-start;apply()};card.onpointerup=()=>{drag=false;if(dx<=-100)doKeep(p);else if(dx>=100)doDelete(p);else reset()};$('#keepBtn').onclick=()=>doKeep(p);$('#delBtn').onclick=()=>doDelete(p);$('#undoBtn').onclick=undo}
async function doKeep(p){undoStack.push({id:p.id,before:{reviewed:p.reviewed,deletedAt:p.deletedAt}});p.reviewed=true;await savePhoto(p);cleanupIds.splice(cleanupIndex,1);if(cleanupIndex>=cleanupIds.length)cleanupIndex=0;render()}
async function doDelete(p){undoStack.push({id:p.id,before:{reviewed:p.reviewed,deletedAt:p.deletedAt}});p.reviewed=true;p.deletedAt=Date.now();await savePhoto(p);cleanupIds.splice(cleanupIndex,1);if(cleanupIndex>=cleanupIds.length)cleanupIndex=0;render()}
async function undo(){const u=undoStack.pop();if(!u)return toast('Nothing to undo');const p=photos.find(x=>x.id===u.id);if(!p)return;p.reviewed=u.before.reviewed;p.deletedAt=u.before.deletedAt;await savePhoto(p);cleanupIds=unreviewed().map(x=>x.id);cleanupIndex=0;render();toast('Undone')}
function renderAlbums(){const built=[{id:'fav',name:'Favourites',count:favs().length},{id:'all',name:'All Photos',count:active().length},...albums.map(a=>({id:a.id,name:a.name,count:active().filter(p=>(p.albumIds||[]).includes(a.id)).length}))];content.innerHTML=`<div class="albums">${built.map(a=>`<div class="album"><b>${escapeHtml(a.name)}</b><span>${a.count} photo${a.count===1?'':'s'}</span><button class="btn" data-album="${a.id}">Open</button></div>`).join('')}</div>`}
function openAlbum(id){let list=id==='fav'?favs():id==='all'?active():active().filter(p=>(p.albumIds||[]).includes(id));content.innerHTML=`<button class="btn" id="backAlbums">← Albums</button><div style="height:14px"></div>${gridHTML(list)}`;hydrateImages();$('#backAlbums').onclick=renderAlbums}
function renderSearch(){const q=$('#searchBox').value.trim().toLowerCase();const albumMatches=albums.filter(a=>a.name.toLowerCase().includes(q)).map(a=>a.id);const list=!q?active():active().filter(p=>p.name.toLowerCase().includes(q)||(p.albumIds||[]).some(id=>albumMatches.includes(id)));content.innerHTML=`<p class="muted">${q?list.length+' result'+(list.length===1?'':'s'):'Type above to search by filename or album.'}</p>${gridHTML(list)}`}
function renderDeleted(){const list=deleted().sort((a,b)=>b.deletedAt-a.deletedAt);if(!list.length){content.innerHTML=`<div class="empty"><div class="emptybox"><h1>Recently Deleted is empty.</h1><p class="muted">Deleted photos stay here for 30 days before Frame removes its browser copy permanently.</p></div></div>`;return}content.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn danger" id="deleteAll">Delete all permanently</button></div>${list.map(p=>`<div class="deletedrow"><img data-id="${p.id}" alt="${escapeHtml(p.name)}"><div class="meta"><b>${escapeHtml(p.name)}</b><span>${Math.max(0,30-Math.floor((Date.now()-p.deletedAt)/86400000))} days left</span></div><button class="btn" data-restore="${p.id}">Restore</button><button class="btn danger" data-perm="${p.id}">Delete</button></div>`).join('')}`;hydrateImages();$('#deleteAll').onclick=async()=>{if(!confirm('Permanently delete all recently deleted photos from Frame Web?'))return;for(const p of list)await removePhoto(p.id);render()}}
function openViewer(id){selectedId=id;const p=photos.find(x=>x.id===id);if(!p)return;const u=urlFor(p);$('#viewerImg').src=u;$('#viewerImg').onload=()=>URL.revokeObjectURL(u);$('#viewerName').textContent=p.name;$('#favBtn').textContent=(p.favorite?'♥':'♡')+' Favourite';$('#viewer').classList.add('open')}
$('#closeViewer').onclick=()=>$('#viewer').classList.remove('open');$('#viewer').addEventListener('click',e=>{if(e.target===$('#viewer'))$('#viewer').classList.remove('open')});
$('#favBtn').onclick=async()=>{const p=photos.find(x=>x.id===selectedId);p.favorite=!p.favorite;await savePhoto(p);openViewer(p.id);render()};
$('#deleteBtn').onclick=async()=>{const p=photos.find(x=>x.id===selectedId);p.deletedAt=Date.now();p.reviewed=true;await savePhoto(p);$('#viewer').classList.remove('open');render();toast('Moved to Recently Deleted')};
$('#addAlbumBtn').onclick=async()=>{if(!albums.length){const name=prompt('No albums yet. Create one:');if(!name?.trim())return;albums.push({id:uid(),name:name.trim()});await saveAlbums()}const p=photos.find(x=>x.id===selectedId);const menu=albums.map((a,i)=>`${i+1}. ${a.name}${(p.albumIds||[]).includes(a.id)?' ✓':''}`).join('\n');const n=Number(prompt('Choose an album number to toggle:\n'+menu));if(!n||!albums[n-1])return;const id=albums[n-1].id;p.albumIds=p.albumIds||[];p.albumIds.includes(id)?p.albumIds=p.albumIds.filter(x=>x!==id):p.albumIds.push(id);await savePhoto(p);toast('Album updated')};
function escapeHtml(s=''){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
openDB().then(load).catch(err=>{console.error(err);content.innerHTML='<div class="empty"><div class="emptybox"><h1>Frame could not open browser storage.</h1><p class="muted">Try reloading or allowing site storage in your browser.</p></div></div>'});
</script>
</body>
</html>
