<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame Web</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{padding:18px;border-right:1px solid #2c2c33;background:#0d0d10;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:900;margin:4px 0 26px}.nav{display:grid;gap:7px}.nav button,.btn{border:1px solid #2c2c33;background:#151519;color:#fff;padding:11px 13px;border-radius:12px;font-weight:800;cursor:pointer}.nav button{border:0;text-align:left;background:transparent;color:#aaa}.nav button.active{background:#18181d;color:#fff}.top{position:sticky;top:0;z-index:5;background:#09090be8;backdrop-filter:blur(16px);border-bottom:1px solid #2c2c33;padding:14px 20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.title{font-size:23px;font-weight:900}.grow{flex:1}.primary{background:#fff;color:#000}.google{background:#fff;color:#222}.danger{color:#ff7b82}.content{padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{padding:14px;border:1px solid #2c2c33;border-radius:16px;background:#141417}.stat b{font-size:23px;display:block}.stat span,.muted{color:#999}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}.thumb{aspect-ratio:1;position:relative;border-radius:12px;overflow:hidden;background:#17171c}.thumb img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:7px;top:7px;border:0;border-radius:50%;width:31px;height:31px;background:#0009;color:#fff}.badge{position:absolute;left:7px;bottom:7px;background:#000a;padding:4px 7px;border-radius:7px;font-size:11px}.empty{min-height:65vh;display:grid;place-items:center;text-align:center}.empty>div{max-width:620px}.empty h1{font-size:46px;margin:10px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.cleanup{display:grid;place-items:center;min-height:72vh}.card{width:min(500px,90vw);aspect-ratio:.84;border:1px solid #2c2c33;border-radius:24px;overflow:hidden;position:relative;background:#050506;touch-action:none;transform:translateX(var(--dx,0px)) rotate(calc(var(--dx,0px)/28));transition:.15s}.card.drag{transition:none}.card img{width:100%;height:100%;object-fit:contain}.name{position:absolute;left:0;right:0;bottom:0;padding:50px 16px 16px;background:linear-gradient(transparent,#000d);font-weight:800}.tag{position:absolute;top:20px;padding:7px 10px;border-radius:8px;font-weight:900;opacity:0}.keep{left:18px;border:3px solid #45d17a;color:#45d17a}.del{right:18px;border:3px solid #ff5b64;color:#ff5b64}.controls{display:flex;gap:15px;justify-content:center;margin-top:14px}.round{width:60px;height:60px;border-radius:50%;background:#111;border:2px solid #333;color:#fff;font-size:24px}.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.album{padding:16px;border:1px solid #2c2c33;border-radius:16px;background:#141417}.deleted{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid #2c2c33}.deleted img{width:62px;height:62px;object-fit:cover;border-radius:9px}.deleted .m{flex:1}.modal{position:fixed;inset:0;background:#000c;z-index:20;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(700px,96vw);max-height:90vh;overflow:auto;background:#111115;border:1px solid #2c2c33;border-radius:20px;padding:18px}.dialog input{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#0b0b0e;color:#fff;margin:10px 0}.viewer{width:100%;max-height:68vh;object-fit:contain;background:#050506;border-radius:14px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.bar .nm{flex:1}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 14px;border-radius:999px;font-weight:800;display:none;z-index:40}.toast.on{display:block}.hidden{display:none!important}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:10;left:0;right:0;top:auto;bottom:0;height:auto;border-right:0;border-top:1px solid #333;padding:7px}.brand{display:none}.nav{grid-template-columns:repeat(5,1fr)}.nav button{text-align:center;font-size:11px;padding:9px 3px}.content{padding:12px 12px 75px}.stats{grid-template-columns:1fr 1fr}.top{padding:10px}.title{font-size:19px}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">▣ Frame</div><div class="nav" id="nav"><button data-v="photos" class="active">Photos</button><button data-v="cleanup">Cleanup</button><button data-v="albums">Albums</button><button data-v="search">Search</button><button data-v="deleted">Deleted</button></div></aside><main><header class="top"><div class="title" id="title">Photos</div><div class="grow"></div><input id="search" class="hidden" placeholder="Search…" style="padding:10px;border-radius:10px;border:1px solid #333;background:#111;color:#fff"><button id="albumBtn" class="btn">+ Album</button><button id="googleBtn" class="btn google">🌈 Google Photos</button><button id="fileBtn" class="btn primary">Import files</button><input id="files" class="hidden" type="file" accept="image/*" multiple></header><section class="content" id="content"></section></main></div>
<div class="modal" id="viewer"><div class="dialog"><img class="viewer" id="vimg"><div class="bar"><div class="nm" id="vname"></div><button class="btn" id="fav">♡ Favourite</button><button class="btn" id="addAlbum">Album</button><button class="btn danger" id="trash">Delete</button><button class="btn" id="close">Close</button></div></div></div>
<div class="modal" id="gsetup"><div class="dialog"><h2>Connect Google Photos</h2><p class="muted">Frame uses Google's official Photos Picker API. Paste a Google OAuth Web Client ID. It stays in this browser.</p><input id="cid" placeholder="…apps.googleusercontent.com"><p class="muted">Enable Google Photos Picker API and add <b>https://frame-mauve-five.vercel.app</b> as an Authorized JavaScript origin in Google Cloud.</p><div class="bar"><button class="btn primary" id="saveCid">Save & connect</button><button class="btn" id="cancelCid">Cancel</button></div></div></div><div class="toast" id="toast"></div>
<script>
const DB='frame-web-v1',S='photos',M='meta',SCOPE='https://www.googleapis.com/auth/photospicker.mediaitems.readonly';let db,photos=[],albums=[],view='photos',sel=null,ids=[],idx=0,undo=[],token=null;const $=q=>document.querySelector(q),C=$('#content');
function say(x,t=2200){const e=$('#toast');e.textContent=x;e.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>e.classList.remove('on'),t)}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()}function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function dur(s){return Math.max(1000,Number(String(s||'2s').replace('s',''))*1000)}
function odb(){return new Promise((a,b)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(S))d.createObjectStore(S,{keyPath:'id'});if(!d.objectStoreNames.contains(M))d.createObjectStore(M)};r.onsuccess=()=>{db=r.result;a()};r.onerror=()=>b(r.error)})}function os(s,m='readonly'){return db.transaction(s,m).objectStore(s)}function rp(r){return new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}async function save(p){await rp(os(S,'readwrite').put(p));let i=photos.findIndex(x=>x.id===p.id);i<0?photos.push(p):photos[i]=p}async function rem(id){await rp(os(S,'readwrite').delete(id));photos=photos.filter(x=>x.id!==id)}async function salb(){await rp(os(M,'readwrite').put(albums,'albums'))}
const active=()=>photos.filter(x=>!x.deletedAt),deleted=()=>photos.filter(x=>x.deletedAt),unrev=()=>active().filter(x=>!x.reviewed),favs=()=>active().filter(x=>x.favorite);function obj(p){return URL.createObjectURL(p.blob)}function hydrate(){C.querySelectorAll('img[data-id]').forEach(i=>{let p=photos.find(x=>x.id===i.dataset.id);if(p){let u=obj(p);i.src=u;i.onload=()=>URL.revokeObjectURL(u)}})}
async function load(){photos=await rp(os(S).getAll());albums=(await rp(os(M).get('albums')))||[];let cut=Date.now()-30*864e5;for(let p of [...photos])if(p.deletedAt&&p.deletedAt<cut)await rem(p.id);render()}
function setv(v){view=v;$('#title').textContent={photos:'Photos',cleanup:'Cleanup',albums:'Albums',search:'Search',deleted:'Recently Deleted'}[v];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('#search').classList.toggle('hidden',v!=='search');$('#albumBtn').classList.toggle('hidden',v!=='albums');render()}$('#nav').onclick=e=>{let b=e.target.closest('button');if(b)setv(b.dataset.v)};$('#search').oninput=render;$('#fileBtn').onclick=()=>$('#files').click();$('#files').onchange=async e=>{let fs=[...e.target.files].filter(f=>f.type.startsWith('image/'));say('Importing '+fs.length);for(let f of fs)await save({id:uid(),name:f.name,blob:f,type:f.type,size:f.size,createdAt:f.lastModified||Date.now(),favorite:false,reviewed:false,deletedAt:null,albumIds:[],source:'files'});e.target.value='';say('Imported '+fs.length);render()};$('#albumBtn').onclick=async()=>{let n=prompt('Album name');if(n?.trim()){albums.push({id:uid(),name:n.trim()});await salb();render()}}
function st(){return `<div class="stats"><div class="stat"><b>${active().length}</b><span>Photos</span></div><div class="stat"><b>${unrev().length}</b><span>Unreviewed</span></div><div class="stat"><b>${favs().length}</b><span>Favourites</span></div><div class="stat"><b>${deleted().length}</b><span>Deleted</span></div></div>`}function grid(a){return `<div class="grid">${a.map(p=>`<div class="thumb" data-id="${p.id}"><img data-id="${p.id}"><button class="heart" data-fav="${p.id}">${p.favorite?'♥':'♡'}</button>${p.reviewed?'<span class="badge">Reviewed</span>':''}</div>`).join('')}</div>`}
function render(){if(view==='photos'){let a=active();C.innerHTML=a.length?st()+grid(a):`<div class="empty"><div><h1>Import your photos.</h1><p class="muted">Pick them directly from Google Photos or choose files. Frame stores its own copy and leaves originals alone.</p><div class="actions"><button class="btn google" onclick="gimport()">🌈 Google Photos</button><button class="btn primary" onclick="files.click()">Import files</button></div></div></div>`}else if(view==='search'){let q=$('#search').value.toLowerCase();C.innerHTML=grid(active().filter(p=>p.name.toLowerCase().includes(q)||(p.albumIds||[]).some(id=>(albums.find(a=>a.id===id)?.name||'').toLowerCase().includes(q))))}else if(view==='albums'){C.innerHTML=`<div class="albums">${albums.map(a=>`<div class="album"><b>${esc(a.name)}</b><p class="muted">${active().filter(p=>(p.albumIds||[]).includes(a.id)).length} photos</p><button class="btn" data-alb="${a.id}">Open</button></div>`).join('')||'<p class="muted">No albums yet.</p>'}</div>`}else if(view==='deleted'){C.innerHTML=deleted().map(p=>`<div class="deleted"><img data-id="${p.id}"><div class="m"><b>${esc(p.name)}</b><div class="muted">Deleted ${new Date(p.deletedAt).toLocaleDateString()}</div></div><button class="btn" data-res="${p.id}">Restore</button><button class="btn danger" data-per="${p.id}">Forever</button></div>`).join('')||'<p class="muted">Nothing deleted.</p>'}else cleanup();setTimeout(hydrate)}
function cleanup(){if(!ids.length||idx>=ids.length){ids=unrev().map(p=>p.id);idx=0}let p=photos.find(x=>x.id===ids[idx]&&!x.deletedAt&&!x.reviewed);if(!p){if(unrev().length){ids=[];return cleanup()}C.innerHTML='<div class="empty"><div><h1>Cleanup complete.</h1><button class="btn" onclick="reset()">Review all again</button></div></div>';return}C.innerHTML=`<div class="cleanup"><div><div class="card" id="card"><img data-id="${p.id}"><span class="tag keep" id="k">KEEP</span><span class="tag del" id="d">DELETE</span><div class="name">${esc(p.name)}</div></div><div class="controls"><button class="round" onclick="act('keep')">←</button><button class="btn" onclick="back()">Undo</button><button class="round" onclick="act('delete')">→</button></div></div></div>`;drag();setTimeout(hydrate)}
function drag(){let c=$('#card'),sx=0,dx=0,on=false;c.onpointerdown=e=>{on=true;sx=e.clientX;c.setPointerCapture(e.pointerId);c.classList.add('drag')};c.onpointermove=e=>{if(!on)return;dx=e.clientX-sx;c.style.setProperty('--dx',dx+'px');$('#k').style.opacity=Math.min(1,Math.max(0,-dx/100));$('#d').style.opacity=Math.min(1,Math.max(0,dx/100))};c.onpointerup=()=>{on=false;c.classList.remove('drag');if(dx<-110)act('keep');else if(dx>110)act('delete');else c.style.setProperty('--dx','0px')}}
async function act(a){let p=photos.find(x=>x.id===ids[idx]);undo.push({...p});p.reviewed=true;if(a==='delete')p.deletedAt=Date.now();await save(p);idx++;cleanup()}async function back(){let p=undo.pop();if(!p)return say('Nothing to undo');await save(p);idx=Math.max(0,idx-1);cleanup()}async function reset(){for(let p of active()){p.reviewed=false;await save(p)}ids=[];cleanup()}
C.onclick=async e=>{let f=e.target.closest('[data-fav]');if(f){let p=photos.find(x=>x.id===f.dataset.fav);p.favorite=!p.favorite;await save(p);return render()}let t=e.target.closest('.thumb');if(t)return openv(t.dataset.id);let r=e.target.closest('[data-res]');if(r){let p=photos.find(x=>x.id===r.dataset.res);p.deletedAt=null;await save(p);return render()}let x=e.target.closest('[data-per]');if(x&&confirm('Delete permanently from Frame?')){await rem(x.dataset.per);return render()}let a=e.target.closest('[data-alb]');if(a){let al=albums.find(x=>x.id===a.dataset.alb);C.innerHTML='<h2>'+esc(al.name)+'</h2>'+grid(active().filter(p=>(p.albumIds||[]).includes(al.id)));setTimeout(hydrate)}}
function openv(id){sel=id;let p=photos.find(x=>x.id===id),u=obj(p);$('#vimg').src=u;$('#vimg').onload=()=>URL.revokeObjectURL(u);$('#vname').textContent=p.name;$('#fav').textContent=p.favorite?'♥ Favourited':'♡ Favourite';$('#viewer').classList.add('open')}$('#close').onclick=()=>$('#viewer').classList.remove('open');$('#fav').onclick=async()=>{let p=photos.find(x=>x.id===sel);p.favorite=!p.favorite;await save(p);openv(sel);render()};$('#trash').onclick=async()=>{let p=photos.find(x=>x.id===sel);p.deletedAt=Date.now();p.reviewed=true;await save(p);$('#viewer').classList.remove('open');render()};$('#addAlbum').onclick=async()=>{if(!albums.length)return say('Create an album first');let n=Number(prompt(albums.map((a,i)=>`${i+1}. ${a.name}`).join('\n'))),a=albums[n-1];if(a){let p=photos.find(x=>x.id===sel);p.albumIds=p.albumIds||[];if(!p.albumIds.includes(a.id))p.albumIds.push(a.id);await save(p);say('Added to '+a.name)}}
function setup(){let c=localStorage.getItem('frame.gcid')||'';$('#cid').value=c;$('#gsetup').classList.add('open')}$('#cancelCid').onclick=()=>$('#gsetup').classList.remove('open');$('#saveCid').onclick=()=>{let c=$('#cid').value.trim();if(!c.endsWith('.apps.googleusercontent.com'))return say('Invalid Google Client ID');localStorage.setItem('frame.gcid',c);$('#gsetup').classList.remove('open');gimport()};$('#googleBtn').onclick=gimport;
async function gt(){let c=localStorage.getItem('frame.gcid');if(!c){setup();throw Error('setup')}for(let i=0;i<50&&!window.google?.accounts?.oauth2;i++)await sleep(100);if(!window.google?.accounts?.oauth2)throw Error('Google sign-in failed to load');return new Promise((ok,no)=>google.accounts.oauth2.initTokenClient({client_id:c,scope:SCOPE,callback:r=>r.error?no(Error(r.error)):(token=r.access_token,ok())}).requestAccessToken({prompt:'consent'}))}
async function gf(url,o={}){let r=await fetch(url,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(o.headers||{})}});if(!r.ok)throw Error('Google '+r.status+': '+(await r.text()).slice(0,150));return r.status===204?null:r.json()}
async function gimport(){try{$('#googleBtn').disabled=true;say('Connecting to Google Photos…',5000);await gt();let s=await gf('https://photospicker.googleapis.com/v1/sessions',{method:'POST',body:JSON.stringify({pickingConfig:{maxItemCount:'2000'}})}),w=window.open(s.pickerUri+(s.pickerUri.includes('?')?'&':'?')+'autoclose=true','framegp','popup,width=1100,height=780');if(!w)throw Error('Allow popups for Frame');say('Pick photos in Google Photos, then press Done.',6000);let start=Date.now(),tout=dur(s.pollingConfig?.timeoutIn||'300s');while(!s.mediaItemsSet&&Date.now()-start<tout){await sleep(dur(s.pollingConfig?.pollInterval||'2s'));s=await gf('https://photospicker.googleapis.com/v1/sessions/'+encodeURIComponent(s.id))}if(!s.mediaItemsSet)throw Error('Google Photos selection timed out');let items=[],pt='';do{let q=new URLSearchParams({sessionId:s.id,pageSize:'100'});if(pt)q.set('pageToken',pt);let p=await gf('https://photospicker.googleapis.com/v1/mediaItems?'+q);items.push(...(p.mediaItems||[]));pt=p.nextPageToken||''}while(pt);items=items.filter(x=>x.type==='PHOTO'&&x.mediaFile?.baseUrl);let n=0;for(let x of items){say(`Importing ${n}/${items.length}…`,6e4);let r=await fetch(x.mediaFile.baseUrl+'=d',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Download failed');let b=await r.blob();await save({id:uid(),googleId:x.id,name:x.mediaFile.filename||'Google Photo',blob:b,type:x.mediaFile.mimeType||b.type,size:b.size,createdAt:x.createTime?new Date(x.createTime).getTime():Date.now(),favorite:false,reviewed:false,deletedAt:null,albumIds:[],source:'google-photos'});n++}await gf('https://photospicker.googleapis.com/v1/sessions/'+encodeURIComponent(s.id),{method:'DELETE'});say('Imported '+n+' from Google Photos',3500);setv('photos')}catch(e){console.error(e);if(e.message!=='setup')say(e.message,6000)}finally{$('#googleBtn').disabled=false}}window.gimport=gimport;odb().then(load)
</script></body></html>
